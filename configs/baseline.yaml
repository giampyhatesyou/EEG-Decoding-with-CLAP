# infra options
devices: 0
accelerator: "auto"
# workers: -1 means "auto-pick" (see src/utils/paths.py:resolve_workers).
# On a shared server it scales to ~min(16, (cpu_count-4)/2); on a laptop with
# 8 cores it picks 2. Override with --workers N from the CLI or with the
# EEG_NUM_WORKERS env var if you need an exact value.
workers: -1
dataset_dir: "../dataset"

# Audio representation switch.
#   "raw"  -> per-stem SampleCNN2DEEG audio encoder (Akama et al. baseline).
#   "clap" -> frozen LAION-CLAP encoder shared across the 4 stems + a small
#             trainable projection head. See src/models/clap_encoder.py.
# All other hyper-parameters, splits, seed, attention filter, and loss are
# kept identical to the baseline so the comparison stays apples-to-apples.
audio_repr: "raw"
# Hidden width of the CLAP projection head (Linear 512 -> hidden -> 100).
# Only used when audio_repr == "clap".
clap_proj_hidden_dim: 256
# LAION-CLAP checkpoint to load. Only used when audio_repr == "clap".
# An empty string makes laion_clap load its bundled default checkpoint
# (general-purpose audio, HTSAT-tiny) into ~/.cache/laion_clap/ on first use.
# To use a specific checkpoint, pass an ABSOLUTE path to a local .pt file; any
# non-path string is ignored with a warning and falls back to the default.
# The CLAP runs in docs/AUDIT_FINDINGS.md all used this bundled default.
clap_pretrained: ""

# EEG representation switch (the EEG-side mirror of audio_repr).
#   "raw"     -> SampleCNN2DEEG on the raw EEG window (Akama et al. baseline).
#   "spectra" -> SpectraEEG: the same time-domain CNN PLUS a band-power
#                (delta/theta/alpha/beta) frequency branch, fused to the same
#                100-d embedding. See src/models/spectra_eeg.py. The output width and
#                everything downstream (loss, metric, audio side, splits) are unchanged,
#                so the raw-vs-spectra comparison stays apples-to-apples.
eeg_repr: "raw"

# Training objective switch (diagnostic axis, in the spirit of audio_repr).
#   "contrastive"    -> the Akama baseline: CLIP/InfoNCE EEG<->audio loss + the
#                       pairwise evaluation metric. DEFAULT; reproduces upstream.
#   "classify_eeg"   -> supervised 4-class classifier on EEG only (encoder ->
#                       Linear(100->4) -> cross-entropy on the attended-element
#                       label). Diagnostic control #2.
#   "classify_audio" -> supervised 4-class classifier on the 4 audio stems only
#                       (concat of the 4 encoder embeddings -> Linear(400->4) ->
#                       cross-entropy). Diagnostic control #1, a NEGATIVE
#                       control: expected ~chance; above-chance = song->label
#                       leakage, not performance.
# The two classify_* objectives use a SEPARATE LightningModule
# (src/modules/supervised_classification.py); the contrastive loss and metric
# are not touched. Distinct from the legacy integer `supervised` flag below.
objective: "contrastive"

# train options
seed: 42
batch_size: 1
max_epochs: 200
dataset: "preprocessing_eegmusic"
test_dataset: ""
supervised: 0

# loss options
optimizer: "Adam"
learning_rate: 0.0003
temperature: 0.5

# reload options
checkpoint_path: ""
resume_checkpoint_path: ""

# audio options
audio_length: 59049
sample_rate: 22050

# experiment options
training_date: "tmp"
loss_function: "clip_loss"
eeg_normalization: "none"
openmiir_augmentation: "no_augmentation"
audio_sample_rate: 44100
eeg_sample_rate: 256
eeg_length: 768
test_data_length: 768
audio_clip_length: 3.0
whole_audio_length: 15.0
dim_reduction: 1
clamp_value: 20
split_seed: 42
train_test_splitting: "none"
detach_z_c: 0

## for gaussian noise
max_amplitude: 0.015
min_amplitude: 0.001

## for sliding window
window_size: 1280
stride: 256

## for shifting time delay
shifting_time: 0

# --- cross-validation routing ---
# How _get_file_list assembles each split. See Preprocessing_EEGMusic_dataset.
#   within            -> reproduce the folder-tree within-subject split (paper)
#   leave_song_out    -> train/valid drop the held-out song; test = held-out
#                        song across all subjects, regardless of original split
#   leave_subject_out -> train/valid drop the held-out subject; test = held-out
#                        subject across all songs
# cv_held_out_id is the int song or subject id for the current fold; ignored
# when cv_mode == "within". Driver scripts in scripts/ loop over folds.
cv_mode: "within"
cv_held_out_id: -1

# --- test-time audit hooks (no effect during training) ---
# Negative-control mode for checkpoint_test.py. Leave at "none" for the real
# evaluation; the other modes are sanity checks meant to falsify the pipeline.
#   none        -> normal evaluation
#   labels      -> shuffle task labels per batch (positive column is wrong);
#                  accuracy should drop to chance (~0.25) and pairwise to ~0.5
#   audio_pair  -> shuffle the (m_v,m_d,m_b,m_o) audio tensors across the
#                  batch so each EEG is paired with a random song's stems;
#                  accuracy must also fall to chance
shuffle_test_mode: "none"
# When > 0, write per-window test records + per-subject/per-song/per-attention
# aggregates as CSVs next to the test figures. Off-by-default to keep the
# baseline test output unchanged.
test_breakdown: 1
