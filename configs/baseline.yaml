# infra options
devices: 0
accelerator: "auto"
# workers: -1 means "auto-pick" (see src/utils/paths.py:resolve_workers).
# On a shared server it scales to ~min(16, (cpu_count-4)/2); on a laptop with
# 8 cores it picks 2. Override with --workers N from the CLI or with the
# EEG_NUM_WORKERS env var if you need an exact value.
workers: -1
dataset_dir: "../dataset"

# Audio representation switch.
#   "raw"  -> per-stem SampleCNN2DEEG audio encoder (Akama et al. baseline).
#   "clap" -> frozen LAION-CLAP encoder shared across the 4 stems + a small
#             trainable projection head. See src/models/clap_encoder.py.
# All other hyper-parameters, splits, seed, attention filter, and loss are
# kept identical to the baseline so the comparison stays apples-to-apples.
audio_repr: "raw"
# Hidden width of the CLAP projection head (Linear 512 -> hidden -> 100).
# Only used when audio_repr == "clap".
clap_proj_hidden_dim: 256
# LAION-CLAP checkpoint to load. The default ("music") is the music-specific
# fine-tune; pass "general" for the general-purpose checkpoint. Empty string
# lets laion_clap pick its bundled default.
clap_pretrained: "music"

# train options
seed: 42
batch_size: 1
max_epochs: 200
dataset: "preprocessing_eegmusic" 
test_dataset: ""
supervised: 0 
projection_dim: 64 

# loss options
optimizer: "Adam" 
learning_rate: 0.0003
weight_decay: 1.0e-6 
temperature: 0.5 

# reload options
checkpoint_path: "" 
resume_checkpoint_path: ""

# logistic regression options
finetuner_mlp: 0
finetuner_checkpoint_path: ""
finetuner_max_epochs: 200
finetuner_batch_size: 256
finetuner_learning_rate: 0.001 

# audio data augmentation options
audio_length: 59049
sample_rate: 22050
transforms_polarity: 0.8
transforms_noise: 0.01
transforms_gain: 0.3
transforms_filters: 0.8
transforms_delay: 0.3
transforms_pitch: 0.6
transforms_reverb: 0.6

# other options
alpha: 1.0
loss2_weight: 1.0
loss1_ratio: 22.00
eval_only: 0
train_only: 0
load_only_clmr_part: 1
spec_aug: 0
spec_aug_timemasking: 0.2
spec_aug_timestretch: 0.1
spec_aug_p: 0.0
save_emb_array: 1
save_clip_emb: 0
save_agct: 0
finetune_aug_less: 0
aug_pattern: 0

# for Mind-Music experiment
eeg_type: "raw"
training_date: "tmp"
loss_function: "clip_loss"
eeg_normalization: "none"
openmiir_augmentation: "no_augmentation"
rmNoisySubject: 0
audio_sample_rate: 44100
eeg_sample_rate: 256
eeg_length: 768
test_data_length: 768
audio_clip_length: 3.0
whole_audio_length: 15.0
dim_reduction: 1
clamp_value: 20
split_seed: 42
train_test_splitting: "none"
detach_z_c: 0

## for gaussian noise
max_amplitude: 0.015
min_amplitude: 0.001

## for sliding window
window_size: 1280
stride: 256

## for shifting time delay
shifting_time: 0

# --- cross-validation routing ---
# How _get_file_list assembles each split. See Preprocessing_EEGMusic_dataset.
#   within            -> reproduce the folder-tree within-subject split (paper)
#   leave_song_out    -> train/valid drop the held-out song; test = held-out
#                        song across all subjects, regardless of original split
#   leave_subject_out -> train/valid drop the held-out subject; test = held-out
#                        subject across all songs
# cv_held_out_id is the int song or subject id for the current fold; ignored
# when cv_mode == "within". Driver scripts in scripts/ loop over folds.
cv_mode: "within"
cv_held_out_id: -1

# --- test-time audit hooks (no effect during training) ---
# Negative-control mode for checkpoint_test.py. Leave at "none" for the real
# evaluation; the other modes are sanity checks meant to falsify the pipeline.
#   none        -> normal evaluation
#   labels      -> shuffle task labels per batch (positive column is wrong);
#                  accuracy should drop to chance (~0.25) and pairwise to ~0.5
#   audio_pair  -> shuffle the (m_v,m_d,m_b,m_o) audio tensors across the
#                  batch so each EEG is paired with a random song's stems;
#                  accuracy must also fall to chance
shuffle_test_mode: "none"
# When > 0, write per-window test records + per-subject/per-song/per-attention
# aggregates as CSVs next to the test figures. Off-by-default to keep the
# baseline test output unchanged.
test_breakdown: 1
